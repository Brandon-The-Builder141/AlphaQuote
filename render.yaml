# AlphaQuote — Render Blueprint (Pass Four prep: free-hosting migration)
#
# Apply from the repo root in Render (New > Blueprint) on the migration
# branch. See docs/DEPLOY-RENDER.md for the full migration-day checklist.
#
# IMPORTANT — no database is defined in this file, on purpose:
# Render's free Postgres expires 30 days after creation. The production
# database is an EXTERNAL Neon Postgres project; the api service receives
# its connection string through the DATABASE_URL env var below.

services:
  # API — Express backend, built from the repo-root Dockerfile (which runs
  # `prisma migrate deploy` against DATABASE_URL on boot, then starts the
  # server on Render's injected $PORT).
  - type: web
    name: alphaquote-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Neon Postgres connection string (external — see note above).
      - key: DATABASE_URL
        sync: false
      # Clerk production-instance secret key.
      - key: CLERK_SECRET_KEY
        sync: false
      # Svix signing secret for the Clerk webhook endpoint
      # (POST /api/webhooks/clerk). Without it the webhook fails closed
      # and accounts are provisioned via in-app sync at sign-in instead.
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      # Comma-separated public origin(s) of alphaquote-web, no wildcards,
      # e.g. https://alphaquote-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Price scraper wiring (Pass Seven). The API is the scraper's only
      # caller, server-to-server. The URL is deterministic from the
      # service name below; the shared secret is generated once on the
      # scraper service and referenced here — it is never typed by hand.
      - key: SCRAPER_SERVICE_URL
        value: https://alphaquote-scraper.onrender.com
      - key: SCRAPER_SHARED_SECRET
        fromService:
          type: web
          name: alphaquote-scraper
          envVarKey: SCRAPER_SHARED_SECRET

  # Web — Create React App build served as a static site.
  # Blueprint spec: static sites are type "web" + runtime "static", and
  # the plan field is NOT supported for them (no compute plan) — omitting
  # it is what makes this service free.
  - type: web
    name: alphaquote-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      # Build-time values — baked into the JS bundle; changing one
      # requires a redeploy of this service.
      - key: REACT_APP_CLERK_PUBLISHABLE_KEY
        sync: false
      # Public URL of alphaquote-api, e.g. https://alphaquote-api.onrender.com
      - key: REACT_APP_API_URL
        sync: false
    routes:
      # SPA fallback: every path serves the app shell; the router decides.
      - type: rewrite
        source: /*
        destination: /index.html

  # Scraper — SerpAPI price service (Pass Seven). A plain Node service
  # running backend/server/scraper.js from the repo root (its only deps,
  # express + cors, live in the root package.json). Browsers never reach
  # it: the API calls it server-to-server with the shared secret.
  #
  # Free plan, like the API: it sleeps when idle. The API tolerates the
  # cold start (15s timeout + one retry) and degrades honestly to
  # 'unavailable' if the scraper cannot be reached — never fake prices.
  - type: web
    name: alphaquote-scraper
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node backend/server/scraper.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Generated once by Render; the API picks the same value up via
      # the fromService reference above. Never a real value in git.
      - key: SCRAPER_SHARED_SECRET
        generateValue: true
      # SerpAPI key (https://serpapi.com) — pasted once in the Render
      # dashboard for this service. Without it the service answers an
      # honest 503 'unconfigured' and the app simply has no live prices;
      # everything else works.
      - key: SERPAPI_KEY
        sync: false
