server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: every client-side route (/, /pricing, /terms, /privacy,
    # /dashboard, ...) serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed static assets; never cache index.html.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
